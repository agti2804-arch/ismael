    // ==================== FUNÇÕES DE UTILITÁRIO ====================
    function mostrarNotificacao(mensagem, tipo = "sucesso") {
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.style.background = tipo === "sucesso" ? "#4a7c59" : "#b5655a";
        toast.textContent = mensagem;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function atualizarStatusSync(estado, mensagem = "") {
        const statusEl = document.getElementById('syncStatus');
        if (statusEl) {
            statusEl.className = `sync-status ${estado}`;
            if (estado === 'syncing') statusEl.textContent = '⏳ Salvando...';
            else if (estado === 'error') statusEl.textContent = `⚠️ ${mensagem || 'Erro'}`;
            else if (estado === 'success') statusEl.textContent = mensagem || '✅ Salvo!';
            else statusEl.textContent = mensagem || '✅ Conectado';
            
            // Resetar status após 3 segundos se for sucesso
            if (estado === 'success') {
                setTimeout(() => {
                    if (statusEl.className === 'sync-status success') {
                        statusEl.className = 'sync-status';
                        statusEl.textContent = '✅ Conectado';
                    }
                }, 3000);
            }
        }
    }
    
    function formatDateToBR(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    
    function formatDateToISO(brDate) {
        if (!brDate) return "";
        let parts = brDate.split('/');
        if (parts.length === 3) {
            let year = parts[2];
            let month = parts[1].padStart(2,'0');
            let day = parts[0].padStart(2,'0');
            if (year.length === 4 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                return `${year}-${month}-${day}`;
            }
        }
        return brDate;
    }
    
    // ==================== SYNC COM FIRESTORE ====================
    async function salvarNoFirestore() {
        if (isSaving) {
            console.log("Já está salvando...");
            return false;
        }
        
        isSaving = true;
        atualizarStatusSync('syncing');
        
        const saveBtn = document.getElementById('syncNowBtn');
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.innerHTML = '💾 Salvando...';
        }
        
        try {
            console.log("Iniciando salvamento no Firestore...");
            const docRef = db.collection(COL_PROGRAMA).doc(DOC_DADOS);
            
            await docRef.set({
                dados: currentData,
                ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            console.log("✅ Dados salvos com sucesso no Firestore!");
            atualizarStatusSync('success', '✅ Salvo na nuvem!');
            mostrarNotificacao("💾 Dados salvos na nuvem com sucesso!");
            
            // Salvar backup local também
            localStorage.setItem('cei_luz_divina_backup', JSON.stringify(currentData));
            
            return true;
        } catch (error) {
            console.error("❌ Erro detalhado ao salvar:", error);
            atualizarStatusSync('error', 'Erro: ' + (error.message || 'Falha na conexão'));
            mostrarNotificacao("❌ Erro ao salvar: " + (error.message || "Verifique sua internet"), "erro");
            return false;
        } finally {
            isSaving = false;
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 Salvar Alterações';
            }
        }
    }
    
    async function carregarDoFirestore(mostrarFeedback = true) {
        if (mostrarFeedback) {
            atualizarStatusSync('syncing', 'Carregando...');
        }
        
        try {
            console.log("Carregando dados do Firestore...");
            const docRef = db.collection(COL_PROGRAMA).doc(DOC_DADOS);
            const docSnap = await docRef.get();
            
            if (docSnap.exists && docSnap.data().dados && docSnap.data().dados.length > 0) {
                currentData = docSnap.data().dados;
                console.log("📥 Dados carregados do Firestore:", currentData.length, "itens");
                if (mostrarFeedback) {
                    atualizarStatusSync('success', '✅ Dados carregados!');
                    mostrarNotificacao("☁️ Dados carregados da nuvem!");
                }
                renderizarTabela();
                return true;
            } else {
                console.log("📭 Nenhum dado no Firestore, usando dados padrão");
                currentData = JSON.parse(JSON.stringify(originalData));
                await salvarNoFirestore();
                if (mostrarFeedback) {
                    atualizarStatusSync('success', '✅ Dados padrão carregados');
                }
                renderizarTabela();
                return false;
            }
        } catch (error) {
            console.error("❌ Erro ao carregar do Firestore:", error);
            if (mostrarFeedback) {
                atualizarStatusSync('error', 'Offline - usando local');
                mostrarNotificacao("⚠️ Erro ao carregar da nuvem. Usando dados locais.", "erro");
            }
            
            // Fallback para dados locais
            const localData = localStorage.getItem('cei_luz_divina_backup');
            if (localData) {
                currentData = JSON.parse(localData);
                console.log("Usando backup local");
            } else {
                currentData = JSON.parse(JSON.stringify(originalData));
            }
            renderizarTabela();
            return false;
        }
    }
    
    // Função para salvar e forçar recarregamento da página
    async function salvarERecarregar() {
        const sucesso = await salvarNoFirestore();
        if (sucesso) {
            mostrarNotificacao("✅ Salvo! Recarregando dados para todos...");
            // Pequeno delay para garantir que o Firestore processou
            setTimeout(async () => {
                await carregarDoFirestore(true);
                mostrarNotificacao("🔄 Dados atualizados da nuvem!");
            }, 500);
        }
    }
    
    // ==================== FUNÇÕES DE MANIPULAÇÃO DE DADOS ====================
    function generateNewItem() {
        let newNumber = 91;
        let lastDate = "2026-08-05";
        if (currentData.length > 0) {
            const lastItem = currentData[currentData.length-1];
            const matchNum = lastItem.palavra.match(/(\d+)\./);
            if (matchNum) newNumber = parseInt(matchNum[1]) + 1;
            else newNumber = currentData.length + 62;
            if (lastItem.data && lastItem.data.match(/\d{4}-\d{2}-\d{2}/)) {
                let date = new Date(lastItem.data);
                date.setDate(date.getDate() + 7);
                lastDate = date.toISOString().split('T')[0];
            }
        }
        return {
            data: lastDate,
            palavra: `${newNumber}. Nova reflexão.`,
            tema: "NOVO",
            recepcao: "COLABORADOR"
        };
    }
    
    async function addToEnd() {
        const newItem = generateNewItem();
        currentData.push(newItem);
        
        let counter = 62;
        for (let i = 0; i < currentData.length; i++) {
            const match = currentData[i].palavra.match(/(\d+)\.\s*(.*)/);
            if (match && match[1] && match[2]) {
                currentData[i].palavra = `${counter}. ${match[2]}`;
            } else if (match && match[1]) {
                currentData[i].palavra = `${counter}. ${currentData[i].palavra.substring(match[1].length + 2)}`;
            } else {
                currentData[i].palavra = `${counter}. ${currentData[i].palavra}`;
            }
            counter++;
        }
        
        selectedRowIndex = currentData.length - 1;
        renderizarTabela();
        mostrarNotificacao("✅ Nova semana adicionada! Salvando...");
        await salvarNoFirestore();
    }
    
    async function editarCelula(idx, campo, novoValor) {
        if (currentData[idx] && currentData[idx][campo] !== undefined) {
            currentData[idx][campo] = novoValor;
            renderizarTabela();
            mostrarNotificacao("💾 Salvando alteração...");
            await salvarNoFirestore();
        }
    }
    
    // ==================== RENDERIZAÇÃO DA TABELA ====================
    function renderizarTabela() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        
        if (currentData.length === 0) {
            const emptyRow = tbody.insertRow();
            const emptyCell = emptyRow.insertCell(0);
            emptyCell.colSpan = 4;
            emptyCell.textContent = "📋 Nenhuma semana cadastrada. Clique em 'Incluir' para adicionar uma nova semana.";
            emptyCell.style.textAlign = "center";
            emptyCell.style.padding = "2rem";
            emptyCell.style.fontStyle = "italic";
            emptyCell.style.color = "#8b7a60";
            atualizarStats();
            return;
        }
        
        currentData.forEach((item, idx) => {
            const row = tbody.insertRow();
            if (selectedRowIndex === idx) row.classList.add('selected-row-highlight');
            
            const tdData = row.insertCell(0);
            const dataSpan = document.createElement('span');
            dataSpan.setAttribute('contenteditable', 'true');
            dataSpan.classList.add('editable-cell');
            dataSpan.textContent = formatDateToBR(item.data);
            dataSpan.addEventListener('blur', async function(e) {
                const newValue = e.target.textContent.trim();
                const oldValue = item.data;
                if (newValue && newValue !== formatDateToBR(oldValue)) {
                    const iso = formatDateToISO(newValue);
                    if (iso && iso.match(/\d{4}-\d{2}-\d{2}/)) {
                        await editarCelula(idx, 'data', iso);
                    } else {
                        await editarCelula(idx, 'data', newValue);
                    }
                } else if (!newValue) {
                    e.target.textContent = formatDateToBR(oldValue);
                }
            });
            tdData.appendChild(dataSpan);
            
            const tdPalavra = row.insertCell(1);
            const palavraSpan = document.createElement('span');
            palavraSpan.setAttribute('contenteditable', 'true');
            palavraSpan.classList.add('editable-cell', 'palavra-text');
            palavraSpan.textContent = item.palavra;
            palavraSpan.addEventListener('blur', async (e) => {
                const newValue = e.target.textContent.trim();
                if (newValue && newValue !== item.palavra) {
                    await editarCelula(idx, 'palavra', newValue);
                } else if (!newValue) {
                    e.target.textContent = item.palavra;
                }
            });
            tdPalavra.appendChild(palavraSpan);
            
            const tdTema = row.insertCell(2);
            const temaSpan = document.createElement('span');
            temaSpan.setAttribute('contenteditable', 'true');
            temaSpan.classList.add('editable-cell');
            temaSpan.style.background = "#e7ddca";
            temaSpan.style.padding = "4px 10px";
            temaSpan.style.borderRadius = "40px";
            temaSpan.style.display = "inline-block";
            temaSpan.textContent = item.tema;
            temaSpan.addEventListener('blur', async (e) => {
                const newValue = e.target.textContent.trim().toUpperCase();
                if (newValue && newValue !== item.tema) {
                    await editarCelula(idx, 'tema', newValue);
                } else if (!newValue) {
                    e.target.textContent = item.tema;
                }
            });
            tdTema.appendChild(temaSpan);
            
            const tdRecep = row.insertCell(3);
            const recepSpan = document.createElement('span');
            recepSpan.setAttribute('contenteditable', 'true');
            recepSpan.classList.add('editable-cell');
            recepSpan.style.background = "#f3ecd9";
            recepSpan.style.padding = "4px 10px";
            recepSpan.style.borderRadius = "40px";
            recepSpan.style.display = "inline-block";
            recepSpan.textContent = item.recepcao;
            recepSpan.addEventListener('blur', async (e) => {
                const newValue = e.target.textContent.trim().toUpperCase();
                if (newValue && newValue !== item.recepcao) {
                    await editarCelula(idx, 'recepcao', newValue);
                } else if (!newValue) {
                    e.target.textContent = item.recepcao;
                }
            });
            tdRecep.appendChild(recepSpan);
            
            row.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.isContentEditable) {
                    selectedRowIndex = idx;
                    renderizarTabela();
                }
            });
        });
        atualizarStats();
    }
    
    function atualizarStats() {
        const temaCount = new Map(), recepCount = new Map();
        currentData.forEach(item => {
            const temaKey = (item.tema || "").toUpperCase();
            const recepKey = (item.recepcao || "").toUpperCase();
            temaCount.set(temaKey, (temaCount.get(temaKey) || 0) + 1);
            recepCount.set(recepKey, (recepCount.get(recepKey) || 0) + 1);
        });
        const sortedTema = Array.from(temaCount.entries()).sort((a,b)=>b[1]-a[1]);
        const sortedRecep = Array.from(recepCount.entries()).sort((a,b)=>b[1]-a[1]);
        document.getElementById('statsTema').innerHTML = sortedTema.map(([n,q],i)=>`<span class="count-badge">${n}</span> (${q}x)${i<sortedTema.length-1?' • ':''}`).join('') || 'Nenhum';
        document.getElementById('statsRecepcao').innerHTML = sortedRecep.map(([n,q],i)=>`<span class="count-badge">${n}</span> (${q}x)${i<sortedRecep.length-1?' • ':''}`).join('') || 'Nenhum';
        document.getElementById('totalSemanas').innerText = currentData.length;
        aplicarFiltro();
    }
    
    function aplicarFiltro() {
        const term = currentFilter.trim().toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        let visible = 0;
        rows.forEach(row => {
            if (term === '' || row.innerText.toLowerCase().includes(term)) {
                row.style.display = '';
                visible++;
            } else row.style.display = 'none';
        });
        let statusSpan = document.querySelector('.info-status');
        if (!statusSpan && document.querySelector('.search-box')) {
            statusSpan = document.createElement('span');
            statusSpan.className = 'info-status';
            document.querySelector('.search-box')?.appendChild(statusSpan);
        }
        if (statusSpan) statusSpan.textContent = term ? ` (${visible} resultados)` : ` (${currentData.length} total)`;
    }
    
    function printTable() { window.print(); }
    
    async function refreshData() {
        mostrarNotificacao("🔄 Atualizando dados da nuvem...");
        await carregarDoFirestore(true);
    }
    
    function buildMonthFilter() {
        const container = document.getElementById('monthNav');
        if (!container) return;
        container.innerHTML = '';
        const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        months.forEach(month => {
            const btn = document.createElement('button');
            btn.textContent = month;
            btn.classList.add('month-btn');
            btn.addEventListener('click', () => {
                const monthNum = months.indexOf(month)+1;
                const monthStr = monthNum<10?`0${monthNum}`:`${monthNum}`;
                document.querySelectorAll('#tableBody tr').forEach(row => {
                    const firstCell = row.cells[0];
                    if (firstCell && firstCell.innerText.split('/')[1] === monthStr) row.style.display = '';
                    else row.style.display = 'none';
                });
                const statusSpan = document.querySelector('.info-status');
                if (statusSpan) statusSpan.textContent = ` 📅 ${month} filtrado`;
                document.getElementById('searchInput').value = '';
                currentFilter = '';
            });
            container.appendChild(btn);
        });
        const allBtn = document.createElement('button');
        allBtn.textContent = '📋 Mostrar Todos';
        allBtn.classList.add('month-btn');
        allBtn.style.background = "#dcc78f";
        allBtn.addEventListener('click', () => { document.getElementById('searchInput').value = ''; currentFilter = ''; aplicarFiltro(); });
        container.appendChild(allBtn);
    }
    
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.addEventListener('input', (e) => { currentFilter = e.target.value; aplicarFiltro(); });
    }
    
    function setupColumnTitleEditing() {
        const colunaTitulo = document.getElementById('colunaPalavraTitulo');
        if (colunaTitulo) {
            const savedTitle = localStorage.getItem('colunaPalavraTitulo');
            if (savedTitle) colunaTitulo.textContent = savedTitle;
            colunaTitulo.addEventListener('blur', function() {
                const newTitle = colunaTitulo.textContent.trim();
                if (newTitle) {
                    localStorage.setItem('colunaPalavraTitulo', newTitle);
                }
            });
        }
    }
    
    function setupEditableSubtitle() {
        const subtitleEl = document.getElementById('subtitle');
        if (subtitleEl) {
            const saved = localStorage.getItem('programSubtitleCEI2026');
            if (saved && saved.trim()) subtitleEl.textContent = saved;
            subtitleEl.addEventListener('blur', () => {
                const newSubtitle = subtitleEl.textContent.trim();
                if (newSubtitle) {
                    localStorage.setItem('programSubtitleCEI2026', newSubtitle);
                }
            });
        }
    }
    
    function setupGlobalButtons() {
        document.getElementById('addRowEndBtn')?.addEventListener('click', addToEnd);
        document.getElementById('printTableBtn')?.addEventListener('click', printTable);
        document.getElementById('syncNowBtn')?.addEventListener('click', salvarERecarregar);
        document.getElementById('refreshDataBtn')?.addEventListener('click', refreshData);
    }
    
    // ==================== INICIALIZAÇÃO ====================
    async function init() {
        buildMonthFilter();
        setupSearch();
        setupGlobalButtons();
        setupEditableSubtitle();
        setupColumnTitleEditing();
        
        // Carregar dados do Firestore
        await carregarDoFirestore(true);
        
        // Configurar listener para mudanças em tempo real
        const docRef = db.collection(COL_PROGRAMA).doc(DOC_DADOS);
        docRef.onSnapshot((docSnap) => {
            if (docSnap.exists && docSnap.data().dados) {
                const novosDados = docSnap.data().dados;
                // Verificar se os dados realmente mudaram
                if (JSON.stringify(novosDados) !== JSON.stringify(currentData)) {
                    console.log("🔄 Detectada mudança remota! Atualizando...");
                    currentData = novosDados;
                    renderizarTabela();
                    mostrarNotificacao("🔄 Dados atualizados automaticamente da nuvem!");
                }
            }
        }, (error) => {
            console.error("Erro no listener:", error);
        });
        
        mostrarNotificacao("✅ Programa carregado! Alterações são salvas automaticamente na nuvem.");
    }
    
    init();
</script>
</body>
</html>
